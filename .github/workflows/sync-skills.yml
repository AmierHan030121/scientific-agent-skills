name: Sync Selected Skills from Upstream

on:
  schedule:
    - cron: '0 16 * * *' # 每天北京时间 0:00
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone upstream and filter
        run: |
          git clone --depth 1 https://github.com/K-Dense-AI/scientific-agent-skills.git upstream
          
          # 清空当前仓库内容（保留 .github 和 .git）
          find . -mindepth 1 -maxdepth 1 ! -name '.github' ! -name '.git' ! -name 'upstream' -exec rm -rf {} +
          
          # 复制上游内容
          cp -r upstream/* .
          
          # 物理删除不需要的 skill 目录
          cd skills
          find . -mindepth 1 -maxdepth 1 -type d \
            ! -name "literature-review" \
            ! -name "markitdown" \
            ! -name "scientific-brainstorming" \
            ! -name "scientific-critical-thinking" \
            ! -name "scientific-writing" \
            -exec rm -rf {} +
          cd ..
          
          rm -rf upstream

      - name: Commit and Push (Force Auth)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          # 检查是否有变化
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-sync selected skills from upstream"
            # 最关键的一行：直接使用 Token 构造 URL 推送，无视所有环境鉴权问题
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          fi
