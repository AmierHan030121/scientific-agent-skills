name: Sync Selected Skills from Upstream

on:
  schedule:
    # 每天 UTC 16:00（即北京时间 00:00）
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          # 关键修复：拉取完整 Git 历史，防止后续对比时报 bad revision
          fetch-depth: 0

      - name: Clone upstream and filter
        run: |
          # 1. 浅克隆上游仓库
          git clone --depth 1 https://github.com/K-Dense-AI/scientific-agent-skills.git upstream
          
          # 2. 清空当前仓库所有内容（保留 .github 目录和 .git 记录）
          find . -mindepth 1 -maxdepth 1 ! -name '.github' ! -name '.git' ! -name 'upstream' -exec rm -rf {} +
          
          # 3. 复制上游文件到当前仓库
          cp -r upstream/* .
          cp -r upstream/.[!.]* . 2>/dev/null || true
          
          # 4. 进入 skills 目录，物理删除不需要的 skill 文件夹
          cd skills
          find . -mindepth 1 -maxdepth 1 -type d \
            ! -name "literature-review" \
            ! -name "markitdown" \
            ! -name "scientific-brainstorming" \
            ! -name "scientific-critical-thinking" \
            ! -name "scientific-writing" \
            -exec rm -rf {} +
          
          # 5. 返回根目录并清理克隆的临时文件夹
          cd ..
          rm -rf upstream

      - name: Commit and push changes
        run: |
          # 配置 Git 身份
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 暂存所有更改
          git add -A
          
          # 如果有变更，则提交并推送；如果没有变更则跳过
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync selected skills from upstream"
            # 使用内置 Token 安全推送（避免账号密码校验错误）
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
          else
            echo "No changes to commit."
          fi
