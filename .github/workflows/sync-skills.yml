name: Sync Selected Skills from Upstream

on:
  schedule:
    # 每天 UTC 16:00（即北京时间 00:00）
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone upstream and filter
        run: |
          # 1. 浅克隆上游仓库（只拉取最新一次提交，速度极快）
          git clone --depth 1 https://github.com/K-Dense-AI/scientific-agent-skills.git upstream
          
          # 2. 清空当前仓库所有内容（保留 .github 目录和 .git 记录）
          find . -mindepth 1 -maxdepth 1 ! -name '.github' ! -name '.git' ! -name 'upstream' -exec rm -rf {} +
          
          # 3. 将上游仓库的文件全部复制到当前仓库
          cp -r upstream/* .
          cp -r upstream/.[!.]* . 2>/dev/null || true # 复制隐藏文件（如果有）
          
          # 4. 进入 skills 目录，物理删除不需要的 skill 文件夹
          cd skills
          find . -mindepth 1 -maxdepth 1 -type d \
            ! -name "literature-review" \
            ! -name "markitdown" \
            ! -name "scientific-brainstorming" \
            ! -name "scientific-critical-thinking" \
            ! -name "scientific-writing" \
            -exec rm -rf {} +
          
          # 5. 返回根目录并清理克隆的临时文件夹
          cd ..
          rm -rf upstream

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync selected skills from upstream"
          branch: main
          commit_options: '--no-verify'
          skip_fetch: true
